name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper is executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Prepare Signing Keystore
        run: |
          echo "=== Configuring Keystore for signing ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore status:"
          ls -lh debug.keystore*

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          echo "=== Starting Gradle Build ==="
          mkdir -p build_logs
          
          # Attempt assembleRelease; if it fails (e.g. no release upload key), build assembleDebug
          if ./gradlew assembleRelease --no-daemon --info --stacktrace 2>&1 | tee build_logs/gradle_release.log; then
            echo "Release build succeeded!"
          else
            echo "Release build did not complete, falling back to assembleDebug with detailed logging..."
            ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | tee build_logs/gradle_debug.log
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_logs/
            app/build/reports/
          retention-days: 7

      - name: Notify Failure to Telegram
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping failure notification."
            exit 0
          fi
          REPO_NAME="${{ github.repository }}"
          REPO_URL="${{ github.server_url }}/${REPO_NAME}"
          COMMIT_HASH="${{ github.sha }}"
          SHORT_SHA="${COMMIT_HASH:0:7}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          SAFE_MSG=$(echo "$COMMIT_MSG" | head -n 2 | sed 's/[<>&]/ /g')
          
          MESSAGE="⚠️ <b>Ошибка сборки Android APK на GitHub Actions!</b>%0A%0A"
          MESSAGE+="📦 <b>Репозиторий:</b> <code>${REPO_NAME}</code>%0A"
          MESSAGE+="🌿 <b>Ветка / Тег:</b> <code>${{ github.ref_name }}</code> (коммит <code>${SHORT_SHA}</code>)%0A"
          if [ -n "$SAFE_MSG" ]; then
            MESSAGE+="💬 <b>Коммит:</b> <i>${SAFE_MSG}</i>%0A"
          fi
          MESSAGE+="📋 Подробный лог сохранен в артефактах <code>build-logs</code> в GitHub Actions."
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}" || true
          exit 0

      - name: Locate APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in outputs"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_FILENAME=$(basename "$APK_PATH")
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.apk_filename }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release (for Tags)
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Релиз ${{ github.ref_name }}
            - Приложение: **Эббингауз: Интервальные повторения**
            - Сборка: APK файл прикреплен к релизу
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification to Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping notification."
            exit 0
          fi

          REPO_NAME="${{ github.repository }}"
          REPO_URL="${{ github.server_url }}/${REPO_NAME}"
          COMMIT_HASH="${{ github.sha }}"
          SHORT_SHA="${COMMIT_HASH:0:7}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_HASH}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            MESSAGE="🚀 <b>Доступен новый релиз: ${TAG_NAME}!</b>%0A%0A"
            MESSAGE+="📦 <b>Репозиторий:</b> <code>${REPO_NAME}</code>%0A"
            MESSAGE+="🏷 <b>Тег:</b> <code>${TAG_NAME}</code>%0A"
            MESSAGE+="📥 <b>Скачать релиз:</b> <a href=\"${REPO_URL}/releases/tag/${TAG_NAME}\">Перейти на GitHub</a>"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            MESSAGE="⚡ <b>Автоматическая компиляция APK после синхронизации из GAS!</b>%0A%0A"
            MESSAGE+="📦 <b>Репозиторий:</b> <code>${REPO_NAME}</code>%0A"
            MESSAGE+="🌿 <b>Ветка:</b> <code>${BRANCH_NAME}</code> (коммит <code>${SHORT_SHA}</code>)%0A"
            if [ -n "$COMMIT_MSG" ]; then
              SAFE_MSG=$(echo "$COMMIT_MSG" | head -n 2 | sed 's/[<>&]/ /g')
              MESSAGE+="💬 <b>Коммит:</b> <i>${SAFE_MSG}</i>%0A"
            fi
            MESSAGE+="🔗 <a href=\"${COMMIT_URL}\">Просмотреть изменения</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" \
            -d "text=${MESSAGE}" || true
          exit 0

      - name: Upload Binary APK to Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping APK upload."
            exit 0
          fi
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          if [ -f "$APK_FILE" ]; then
            FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 52428800 ]; then
              CAPTION="📱 <b>Hermann Memo APK</b> (Сборка GitHub Actions: <code>${{ github.ref_name }}</code>)"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F caption="${CAPTION}" \
                -F parse_mode="HTML" \
                -F document=@"${APK_FILE}" || true
            else
              echo "APK file exceeds 50MB, skipping direct upload to Telegram."
            fi
          fi
          exit 0
