name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in outputs"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Релиз ${{ github.ref_name }}
            - Приложение: **Эббингауз: Интервальные повторения**
            - Версия: `${{ github.ref_name }}`
            - Сборка: APK файл прикреплен ниже
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release Notification to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping notification."
            exit 0
          fi

          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.repository }}"
          REPO_URL="${{ github.server_url }}/${REPO_NAME}"
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG_NAME}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          MESSAGE="🚀 <b>Доступна новая версия: ${TAG_NAME}!</b>%0A%0A"
          MESSAGE+="📦 <b>Проект:</b> <code>${REPO_NAME}</code>%0A"
          MESSAGE+="🏷 <b>Версия:</b> <code>${TAG_NAME}</code>%0A"
          if [ -n "$COMMIT_MSG" ]; then
            SAFE_MSG=$(echo "$COMMIT_MSG" | head -n 3 | sed 's/[<>&]/ /g')
            MESSAGE+="📝 <b>Описание:</b>%0A<i>${SAFE_MSG}</i>%0A%0A"
          fi
          MESSAGE+="📥 <b>Скачать релиз:</b> <a href=\"${RELEASE_URL}\">Перейти на GitHub</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" \
            -d "text=${MESSAGE}"

      - name: Upload Binary to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
            if [ -f "$APK_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -lt 52428800 ]; then
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                  -F chat_id="${TELEGRAM_CHAT_ID}" \
                  -F caption="📱 Файл релиза <b>${{ github.ref_name }}</b>" \
                  -F parse_mode="HTML" \
                  -F document=@"${APK_FILE}"
              else
                echo "APK file exceeds 50MB, skipping direct upload to Telegram."
              fi
            fi
          fi
